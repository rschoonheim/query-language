name: Go Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.1'

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      uses: dominikh/staticcheck-action@v1
      with:
        version: "latest"

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Coverage
      run: go tool cover -func=coverage.out
